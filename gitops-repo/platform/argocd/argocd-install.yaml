---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/name: argocd
---
# ArgoCD installed via upstream manifest (pinned version)
# Apply with: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.10.4/manifests/install.yaml
# The following configures ArgoCD after install:

---
# ArgoCD ConfigMap: enable multi-cluster mode and Helm/Kustomize
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  # Allow sync of cluster-scoped resources
  application.resourceTrackingMethod: annotation
  # Enable Helm and Kustomize
  kustomize.enabled: "true"
  helm.enabled: "true"
  # Auto-create namespace on sync
  application.instance.label.key: argocd.argoproj.io/app-name
  resource.customizations: |
    networking.k8s.io/Ingress:
      health.lua: |
        hs = {}
        hs.status = "Healthy"
        return hs
---
# ArgoCD RBAC: restrict developer access
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
data:
  policy.default: role:readonly
  policy.csv: |
    # Platform team has full access
    p, role:platform-admin, applications, *, */*, allow
    p, role:platform-admin, clusters, *, *, allow
    p, role:platform-admin, repositories, *, *, allow
    # App team can sync their own apps
    p, role:app-developer, applications, sync, app-team/*, allow
    p, role:app-developer, applications, get, app-team/*, allow
    g, platform-team, role:platform-admin
    g, app-team, role:app-developer
---
# Register staging cluster
apiVersion: v1
kind: Secret
metadata:
  name: staging-cluster-secret
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: staging-cluster
  server: https://staging-cluster.example.com   # replaced at deploy time
  config: |
    {
      "execProviderConfig": {
        "command": "aws",
        "args": ["eks", "get-token", "--cluster-name", "staging-cluster", "--region", "eu-west-1"],
        "apiVersion": "client.authentication.k8s.io/v1beta1"
      },
      "tlsClientConfig": {
        "insecure": false,
        "caData": "<base64-ca-cert>"
      }
    }
---
# Register production cluster
apiVersion: v1
kind: Secret
metadata:
  name: production-cluster-secret
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: production-cluster
  server: https://production-cluster.example.com   # replaced at deploy time
  config: |
    {
      "execProviderConfig": {
        "command": "aws",
        "args": ["eks", "get-token", "--cluster-name", "production-cluster", "--region", "eu-west-1"],
        "apiVersion": "client.authentication.k8s.io/v1beta1"
      },
      "tlsClientConfig": {
        "insecure": false,
        "caData": "<base64-ca-cert>"
      }
    }
