apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-web-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Dakshayani2005/multi-cluster-platform.git
    targetRevision: main
    path: gitops-repo/apps/web-app
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

