global:
  scrape_interval: 15s
  external_labels:
    cluster: local-dev
    environment: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: web-app
    static_configs:
      - targets: ['web-app:8080']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
