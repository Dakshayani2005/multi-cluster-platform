---
# NOTE: In production, use External Secrets Operator (ESO) or Sealed Secrets
# to populate this secret from AWS Secrets Manager or Vault.
# This placeholder shows the correct structure.
# Never commit real credentials to Git.
#
# To create via ESO from AWS Secrets Manager:
#   kubectl apply -f postgres-external-secret.yaml
#
# For local testing only, create manually:
#   kubectl create secret generic postgres-credentials \
#     --namespace=database \
#     --from-literal=username=appuser \
#     --from-literal=password=$(openssl rand -base64 24)

# ExternalSecret (requires External Secrets Operator):
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: multi-cluster-platform/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: multi-cluster-platform/postgres
        property: password
