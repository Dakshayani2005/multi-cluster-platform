---
apiVersion: v1
kind: Namespace
metadata:
  name: production
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: production-cluster
  namespace: production
  labels:
    environment: production
    region: eu-west-1
    managed-by: cluster-api
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["192.169.0.0/16"]
    services:
      cidrBlocks: ["10.129.0.0/12"]
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta2
    kind: AWSManagedControlPlane
    name: production-cluster-control-plane
    namespace: production
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: AWSManagedCluster
    name: production-cluster
    namespace: production
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: AWSManagedControlPlane
metadata:
  name: production-cluster-control-plane
  namespace: production
spec:
  region: eu-west-1
  version: "v1.29"
  eksClusterName: production-cluster
  iamAuthenticatorConfig:
    mapRoles:
      - rolearn: arn:aws:iam::ACCOUNT_ID:role/production-node-role
        username: system:node:{{EC2PrivateDNSName}}
        groups:
          - system:bootstrappers
          - system:nodes
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSManagedMachinePool
metadata:
  name: production-worker-pool
  namespace: production
spec:
  eksNodegroupName: production-workers
  instanceType: t3.medium
  scaling:
    minSize: 2
    maxSize: 4
    desiredSize: 2
