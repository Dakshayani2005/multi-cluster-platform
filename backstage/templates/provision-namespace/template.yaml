apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: provision-namespace
  title: Provision Team Namespace
  description: Self-service provisioning of a new isolated namespace with resource quotas and network policies
  tags:
    - namespace
    - self-service
    - platform
spec:
  owner: platform-team
  type: infrastructure

  parameters:
    - title: Namespace Details
      required: [teamName, environment, requestedCpu, requestedMemory]
      properties:
        teamName:
          title: Team Name
          type: string
          description: Lowercase team name (becomes namespace prefix)
          pattern: '^[a-z][a-z0-9-]{1,20}$'
        environment:
          title: Environment
          type: string
          enum: [staging, production]
          default: staging
        requestedCpu:
          title: CPU Request (cores)
          type: number
          default: 4
          enum: [2, 4, 8, 16]
        requestedMemory:
          title: Memory Request (Gi)
          type: number
          default: 8
          enum: [4, 8, 16, 32]
        justification:
          title: Business Justification
          type: string
          description: Why does this team need a dedicated namespace?

  steps:
    - id: generate-namespace-manifests
      name: Generate Namespace Manifests
      action: fetch:template
      input:
        url: ./namespace-skeleton
        values:
          teamName: ${{ parameters.teamName }}
          environment: ${{ parameters.environment }}
          requestedCpu: ${{ parameters.requestedCpu }}
          requestedMemory: ${{ parameters.requestedMemory }}

    - id: open-pr
      name: Open Pull Request to GitOps Repo
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=multi-cluster-platform&owner=Dakshayani2005
        branchName: provision-namespace-${{ parameters.teamName }}-${{ parameters.environment }}
        title: "feat: provision namespace for ${{ parameters.teamName }} in ${{ parameters.environment }}"
        description: |
          Automated namespace provisioning request.

          Team: ${{ parameters.teamName }}
          Environment: ${{ parameters.environment }}
          CPU: ${{ parameters.requestedCpu }} cores
          Memory: ${{ parameters.requestedMemory }}Gi

          Justification: ${{ parameters.justification }}

          This PR was generated by Backstage self-service workflow.
        targetPath: rbac/namespaces

  output:
    links:
      - title: View Pull Request
        url: ${{ steps['open-pr'].output.remoteUrl }}
